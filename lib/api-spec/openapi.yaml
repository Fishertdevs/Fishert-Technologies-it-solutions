openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: content
    description: Public site content
  - name: contact
    description: Contact submissions
  - name: reviews
    description: Customer reviews
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /social-links:
    get:
      operationId: listSocialLinks
      tags: [content]
      summary: List active social links grouped by category
      responses:
        "200":
          description: Social links grouped by category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialLinksResponse"
  /plans:
    get:
      operationId: listPlans
      tags: [content]
      summary: List service plans grouped by category
      responses:
        "200":
          description: Service plans grouped by category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlansResponse"
  /reviews:
    get:
      operationId: listPublishedReviews
      tags: [reviews]
      summary: List published reviews
      responses:
        "200":
          description: Published customer reviews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewsResponse"
    post:
      operationId: createReview
      tags: [reviews]
      summary: Submit a review for moderation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "201":
          description: Review submitted and awaiting moderation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewSubmission"
        "400":
          description: Invalid review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contacts:
    post:
      operationId: createContact
      tags: [contact]
      summary: Submit a contact message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Contact message saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactSubmission"
        "400":
          description: Invalid contact message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ServiceCategory:
      type: object
      required: [slug, nameEs, nameEn]
      properties:
        slug:
          type: string
        nameEs:
          type: string
        nameEn:
          type: string
    SocialLink:
      type: object
      required: [label, icon, url]
      properties:
        label:
          type: string
        icon:
          type: string
        url:
          type: string
    SocialLinkCategory:
      type: object
      required: [category, links]
      properties:
        category:
          type: string
        links:
          type: array
          items:
            $ref: "#/components/schemas/SocialLink"
    SocialLinksResponse:
      type: array
      items:
        $ref: "#/components/schemas/SocialLinkCategory"
    Plan:
      type: object
      required: [slug, nameEs, nameEn, price, currency, isCustom, features]
      properties:
        slug:
          type: string
        nameEs:
          type: string
        nameEn:
          type: string
        price:
          type: string
        currency:
          type: string
        periodEs:
          type: ["string", "null"]
        periodEn:
          type: ["string", "null"]
        badgeEs:
          type: ["string", "null"]
        badgeEn:
          type: ["string", "null"]
        isCustom:
          type: boolean
        features:
          type: array
          items:
            $ref: "#/components/schemas/PlanFeature"
    PlanFeature:
      type: object
      required: [textEs, textEn]
      properties:
        textEs:
          type: string
        textEn:
          type: string
    PlanCategory:
      type: object
      required: [category, plans]
      properties:
        category:
          $ref: "#/components/schemas/ServiceCategory"
        plans:
          type: array
          items:
            $ref: "#/components/schemas/Plan"
    PlansResponse:
      type: array
      items:
        $ref: "#/components/schemas/PlanCategory"
    Review:
      type: object
      required: [name, text, rating]
      properties:
        name:
          type: string
        company:
          type: ["string", "null"]
        text:
          type: string
        rating:
          type: number
          minimum: 1
          maximum: 5
    ReviewsResponse:
      type: array
      items:
        $ref: "#/components/schemas/Review"
    ReviewInput:
      type: object
      required: [name, text, rating]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        company:
          type: ["string", "null"]
          maxLength: 160
        text:
          type: string
          minLength: 10
          maxLength: 2000
        rating:
          type: number
          minimum: 1
          maximum: 5
    ReviewSubmission:
      type: object
      required: [id, status, createdAt]
      properties:
        id:
          type: number
        status:
          type: string
          enum: [pending]
        createdAt:
          type: string
          format: date-time
    ContactInput:
      type: object
      required: [name, email, message]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          maxLength: 254
        company:
          type: ["string", "null"]
          maxLength: 160
        phone:
          type: ["string", "null"]
          maxLength: 40
        message:
          type: string
          minLength: 10
          maxLength: 4000
    ContactSubmission:
      type: object
      required: [id, createdAt]
      properties:
        id:
          type: number
        createdAt:
          type: string
          format: date-time

