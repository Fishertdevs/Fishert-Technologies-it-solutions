kind = "web"
previewPath = "/"
title = "Clark Kent"
description = "A multilingual creative agency portfolio website for Clark Kent — showcasing services, team, portfolio works, and client testimonials with Spanish/English language switching, cookie consent, custom Helvetica Neue typography, and 3D/GSAP-powered animations."
version = "1.0.0"
id = "artifacts/clark-kent"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25279

[services.development]
run = "pnpm --filter @workspace/clark-kent run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/clark-kent", "run", "build" ]
serve = "static"
publicDir = "artifacts/clark-kent/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25279"
BASE_PATH = "/"
